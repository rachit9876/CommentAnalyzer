<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>YouTube Comment Sentiment Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'spin': 'spin 1s linear infinite',
                    }
                }
            }
        }
    </script>
    <style>
        .mask-gradient-tl {
            mask-image: linear-gradient(135deg, white, transparent 50%);
        }
        .mask-gradient-br {
            mask-image: linear-gradient(135deg, transparent 50%, white);
        }
        .scrollbar-thin::-webkit-scrollbar {
            width: 8px;
        }
        .scrollbar-track-gray-800::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        .scrollbar-thumb-gray-600::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
        .scrollbar-thumb-gray-600::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        /* Glass morphism styles */
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .glass-input {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }
        
        .glass-input:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
        }
        
        .glass-button {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
        }
        
        .glass-button:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        .glass-reflection::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 40%;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.1), transparent);
            border-radius: inherit;
            z-index: -1;
        }
        
        /* Custom dropdown styling */
        .glass-select {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%23ffffff' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
            padding-right: 2.5rem;
        }
        
        .glass-select option {
            background: rgba(30, 30, 40, 0.95);
            color: #ffffff;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        
        /* For Firefox */
        .glass-select option:hover, 
        .glass-select option:focus,
        .glass-select option:checked {
            background: rgba(100, 100, 255, 0.2);
            color: #ffffff;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.cells.min.js"></script>
</head>
<body class="bg-gradient-to-br from-indigo-900 via-purple-900 to-pink-800 text-gray-200 min-h-screen relative">
    <div id="vanta-bg" class="fixed inset-0 -z-20 opacity-30"></div>
    <div class="fixed inset-0 -z-10 bg-gradient-to-br from-blue-500/5 via-transparent to-cyan-500/5"></div>
    
    <header class="fixed top-0 left-0 right-0 glass z-50 py-0.5 glass-reflection">
        <div class="max-w-6xl mx-auto px-4 flex items-center justify-between">
            <h1 class="text-gray-200 text-xl font-light tracking-wide">Sentiment Analyze</h1>
            <button type="button" id="random-url-btn" class="px-4 py-2 glass-button rounded-lg text-pink-300 text-sm transition-all hover:shadow-lg hover:shadow-pink-500/20 focus:outline-none focus:ring-2 focus:ring-pink-500/30">
                Auto Fill [API + URL]
            </button>
        </div>
    </header>

    <main class="mt-12 py-8">
        <div class="max-w-6xl mx-auto px-4">
            <section class="glass rounded-3xl p-8 mb-8 relative glass-reflection">
                <div class="absolute inset-0 rounded-3xl border border-white/10 mask-gradient-tl pointer-events-none"></div>
                <div class="absolute inset-0 rounded-3xl border border-blue-400/20 mask-gradient-br pointer-events-none"></div>
                
                <div class="mb-6">
                    <label for="api-key" class="block mb-2 font-light text-gray-200">API Key:</label>
                    <input type="password" id="api-key" placeholder="Enter YouTube API key" required class="w-full px-3 py-3 rounded-xl glass-input shadow-lg transition-all focus:outline-none placeholder-gray-400">
                    <small class="block mt-1 text-gray-400 text-sm">Get from <a href="https://console.developers.google.com/" target="_blank" class="text-pink-300 hover:text-pink-200 hover:underline">Google Console</a></small>
                </div>

                <div class="mb-6">
                    <label for="youtube-url" class="block mb-2 font-light text-gray-200">Video URL:</label>
                    <input type="url" id="youtube-url" placeholder="https://www.youtube.com/watch?v=YbJOTdZBX1g" required class="w-full px-3 py-3 rounded-xl glass-input shadow-lg transition-all focus:outline-none placeholder-gray-400">
                </div>
                
                <div class="mb-6">
                    <label for="comment-count" class="block mb-2 font-light text-gray-200">Comments:</label>
                    <select id="comment-count" class="w-full px-3 py-3 rounded-xl glass-input glass-select shadow-lg transition-all focus:outline-none appearance-none">
                        <option value="50">50</option>
                        <option value="100" selected>100</option>
                        <option value="200">200</option>
                        <option value="500">500</option>
                    </select>
                </div>

                <button id="analyze-btn" class="w-full px-4 py-4 glass-button rounded-2xl text-gray-200 text-lg font-light cursor-pointer transition-all shadow-lg disabled:opacity-70 disabled:cursor-not-allowed disabled:transform-none">
                    <span class="btn-text">Analyze</span>
                    <span class="loading-spinner animate-spin" style="display: none;">⏳</span>
                </button>
            </section>

            <section id="results-section" class="glass rounded-3xl p-8 relative glass-reflection" style="display: none;">
                <div class="absolute inset-0 rounded-3xl border border-white/10 mask-gradient-tl pointer-events-none"></div>
                <div class="absolute inset-0 rounded-3xl border border-blue-400/20 mask-gradient-br pointer-events-none"></div>
                
                <div class="text-center mb-8 p-6 glass-card rounded-xl" id="recommendation">
                    <h4 class="text-gray-200 text-xl mb-2 font-light">Recommendation:</h4>
                    <p id="recommendation-text" class="text-gray-300 text-lg font-light">Analyzing...</p>
                </div>
                
                <div class="grid md:grid-cols-2 gap-8 mb-8">
                    <div class="glass-card rounded-2xl p-6">
                        <h3 class="text-gray-200 mb-4 text-center text-xl font-light">Sentiment Distribution</h3>
                        <canvas id="sentiment-chart"></canvas>
                    </div>
                    
                    <div class="glass-card rounded-2xl p-6">
                        <h3 class="text-gray-200 mb-4 text-center text-xl font-light">Analysis Results</h3>
                        <div class="space-y-4">
                            <div class="glass-card rounded-2xl p-6 text-center border-l-4 border-cyan-400/30 transition-all hover:-translate-y-1">
                                <div class="text-3xl font-light text-gray-200 mb-2" id="positive-count">0</div>
                                <div class="text-gray-300 text-sm mb-1">Positive Comments</div>
                                <div class="text-gray-400 text-lg font-light" id="positive-percentage">0%</div>
                            </div>
                            
                            <div class="glass-card rounded-2xl p-6 text-center border-l-4 border-blue-400/30 transition-all hover:-translate-y-1">
                                <div class="text-3xl font-light text-gray-200 mb-2" id="negative-count">0</div>
                                <div class="text-gray-300 text-sm mb-1">Negative Comments</div>
                                <div class="text-gray-400 text-lg font-light" id="negative-percentage">0%</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mt-8">
                    <h3 class="text-gray-200 mb-4 text-center text-xl font-light">Sample Comments Analysis</h3>
                    <div id="comments-list" class="space-y-4 max-h-96 overflow-y-auto scrollbar-thin scrollbar-thumb-gray-600 scrollbar-track-gray-800">
                        <!-- Comments will be populated here -->
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        VANTA.CELLS({
            el: "#vanta-bg",
            mouseControls: true,
            touchControls: true,
            gyroControls: false,
            minHeight: 200.00,
            minWidth: 200.00,
            scale: 1.00,
            color1: 0x4f46e5,
            color2: 0xec4899,
            size: 1.5
        })
    </script>
</body>
</html>
