<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>YouTube Comment Sentiment Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Space Grotesk"', 'sans-serif'],
                    },
                    boxShadow: {
                        'neo': '5px 5px 0px 0px rgba(0,0,0,1)',
                        'neo-sm': '3px 3px 0px 0px rgba(0,0,0,1)',
                        'neo-lg': '8px 8px 0px 0px rgba(0,0,0,1)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #e0e7ff; /* Light indigo background */
            background-image: radial-gradient(#4f46e5 1px, transparent 1px);
            background-size: 20px 20px;
        }
        
        .neo-card {
            background-color: white;
            border: 3px solid black;
            box-shadow: 8px 8px 0px 0px rgba(0,0,0,1);
            transition: all 0.2s ease-in-out;
        }

        .neo-input {
            background-color: white;
            border: 3px solid black;
            box-shadow: 4px 4px 0px 0px rgba(0,0,0,1);
            transition: all 0.2s ease-in-out;
        }
        
        .neo-input:focus {
            box-shadow: 2px 2px 0px 0px rgba(0,0,0,1);
            transform: translate(2px, 2px);
            outline: none;
        }
        
        .neo-button {
            border: 3px solid black;
            box-shadow: 4px 4px 0px 0px rgba(0,0,0,1);
            transition: all 0.2s ease-in-out;
            font-weight: 700;
        }
        
        .neo-button:hover:not(:disabled) {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px 0px rgba(0,0,0,1);
        }
        
        .neo-button:active:not(:disabled) {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px 0px rgba(0,0,0,1);
        }

        .neo-button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            box-shadow: none;
            transform: translate(4px, 4px);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 12px;
        }
        ::-webkit-scrollbar-track {
            background: white;
            border-left: 3px solid black;
        }
        ::-webkit-scrollbar-thumb {
            background: #fbbf24; /* Amber-400 */
            border: 3px solid black;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #f59e0b; /* Amber-500 */
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="text-black min-h-screen">
    
    <header class="fixed top-0 left-0 right-0 bg-yellow-300 border-b-4 border-black z-50 py-4">
        <div class="max-w-6xl mx-auto px-4 flex items-center justify-between">
            <h1 class="text-2xl font-bold tracking-tight uppercase">Sentiment<span class="bg-black text-white px-2 ml-1">Analyzer</span></h1>
            <button type="button" id="random-url-btn" class="px-4 py-2 bg-purple-400 neo-button text-black text-sm font-bold">
                Auto Fill
            </button>
        </div>
    </header>

    <main class="mt-24 py-8">
        <div class="max-w-6xl mx-auto px-4">
            <section class="neo-card p-8 mb-12 rounded-none">
                <div class="mb-8">
                    <h2 class="text-3xl font-bold mb-6 border-b-4 border-black pb-2 inline-block">Configuration</h2>

                    <div class="mb-6">
                        <label for="api-key" class="block mb-2 font-bold text-lg">API Key</label>
                        <input type="password" id="api-key" placeholder="Enter YouTube API key" required class="w-full px-4 py-3 neo-input text-lg placeholder-gray-500">
                        <small class="block mt-2 font-bold">Get from <a href="https://console.developers.google.com/" target="_blank" class="text-blue-600 hover:text-blue-800 hover:underline bg-blue-100 px-1 border border-black">Google Console</a></small>
                    </div>

                    <div class="mb-6">
                        <label for="youtube-url" class="block mb-2 font-bold text-lg">Video URL</label>
                        <input type="url" id="youtube-url" placeholder="https://www.youtube.com/watch?v=..." required class="w-full px-4 py-3 neo-input text-lg placeholder-gray-500">
                    </div>

                    <div class="mb-8">
                        <label for="comment-count" class="block mb-2 font-bold text-lg">Comments to Analyze</label>
                        <div class="relative">
                            <select id="comment-count" class="w-full px-4 py-3 neo-input appearance-none bg-white text-lg cursor-pointer">
                                <option value="50">50</option>
                                <option value="100" selected>100</option>
                                <option value="200">200</option>
                                <option value="500">500</option>
                            </select>
                            <div class="absolute right-4 top-1/2 transform -translate-y-1/2 pointer-events-none">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                                </svg>
                            </div>
                        </div>
                    </div>

                    <button id="analyze-btn" class="w-full px-6 py-4 bg-green-400 neo-button text-xl uppercase tracking-wider">
                        <span class="btn-text">Analyze Comments</span>
                        <span class="loading-spinner animate-spin inline-block ml-2" style="display: none;">⏳</span>
                    </button>
                </div>
            </section>

            <section id="results-section" class="neo-card p-8 bg-blue-50" style="display: none;">
                <h2 class="text-3xl font-bold mb-8 border-b-4 border-black pb-2 inline-block">Analysis Results</h2>
                
                <div class="text-center mb-10 p-6 border-4 border-black bg-white shadow-neo-sm" id="recommendation">
                    <h4 class="text-xl mb-2 font-bold uppercase">Recommendation</h4>
                    <p id="recommendation-text" class="text-xl font-medium">Analyzing...</p>
                </div>
                
                <div class="grid md:grid-cols-2 gap-8 mb-10">
                    <div class="bg-white border-4 border-black p-6 shadow-neo-sm">
                        <h3 class="font-bold mb-6 text-center text-xl uppercase bg-yellow-300 border-2 border-black inline-block px-3 py-1 mx-auto">Sentiment Distribution</h3>
                        <div class="p-4">
                            <canvas id="sentiment-chart"></canvas>
                        </div>
                    </div>
                    
                    <div class="bg-white border-4 border-black p-6 shadow-neo-sm">
                        <h3 class="font-bold mb-6 text-center text-xl uppercase bg-pink-300 border-2 border-black inline-block px-3 py-1 mx-auto">Stats</h3>
                        <div class="space-y-6">
                            <div class="p-6 text-center border-4 border-black bg-green-100 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:translate-x-1 hover:translate-y-1 hover:shadow-none transition-all">
                                <div class="text-4xl font-bold mb-2" id="positive-count">0</div>
                                <div class="font-bold uppercase tracking-wide text-sm">Positive Comments</div>
                                <div class="text-xl font-bold mt-2 bg-black text-white inline-block px-2" id="positive-percentage">0%</div>
                            </div>
                            
                            <div class="p-6 text-center border-4 border-black bg-red-100 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:translate-x-1 hover:translate-y-1 hover:shadow-none transition-all">
                                <div class="text-4xl font-bold mb-2" id="negative-count">0</div>
                                <div class="font-bold uppercase tracking-wide text-sm">Negative Comments</div>
                                <div class="text-xl font-bold mt-2 bg-black text-white inline-block px-2" id="negative-percentage">0%</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mt-8">
                    <h3 class="font-bold mb-6 text-2xl border-b-4 border-black pb-2">Sample Comments</h3>
                    <div id="comments-list" class="space-y-4 max-h-96 overflow-y-auto pr-2">
                        <!-- Comments will be populated here -->
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
