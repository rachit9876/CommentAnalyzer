<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Comment Sentiment Analyzer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <!-- live background removed -->
    <button id="flow-btn" class="flow-btn" title="View Architecture Flow">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
            <path d="M12 16V12M12 8H12.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
    </button>
    <div class="container">
        <header class="app-bar">
            <div class="brand">
                <div>
                    <div class="brand-text-main">Sentiment Analyze</div>
                    <div class="brand-text-sub">YouTube comments quick insights</div>
                </div>
            </div>
            <div style="display:flex;gap:12px">
                <a href="api.html" class="btn secondary">API Docs</a>
                <a href="text-analyzer.html" class="btn secondary">Text Analyzer</a>
                <button id="random-url-btn" class="btn secondary">Auto Fill [API + URL]</button>
            </div>
        </header>

        <section class="card">
            <div class="form-row">
                <div class="field">
                    <label for="api-key">API Key</label>
                    <input id="api-key" type="password" placeholder="Enter YouTube API key">
                    <div class="muted" style="font-size:12px;margin-top:8px">Get from <a href="https://console.developers.google.com/" target="_blank">Google Console</a></div>
                </div>

                <div class="field">
                    <label for="youtube-url">Video URL</label>
                    <input id="youtube-url" type="url" placeholder="https://www.youtube.com/watch?v=YbJOTdZBX1g">
                </div>

                <div class="field-small">
                    <label for="comment-count">Comments</label>
                    <select id="comment-count">
                        <option value="50">50</option>
                        <option value="100">100</option>
                        <option value="200">200</option>
                        <option value="500">500</option>
                        <option value="750" selected>750</option>
                        <option value="1000">1000</option>
                    </select>
                </div>
            </div>

            <div class="actions">
                <button id="analyze-btn" class="btn">Analyze</button>
                <div class="muted" style="align-self:center">Tip: Press Enter to analyze</div>
            </div>
        </section>

        <section id="results-section" class="card" style="display:none">
            <div id="recommendation">
                <div id="recommendation-title">Recommendation</div>
                <div id="recommendation-text">Analyzing...</div>
            </div>

            <div class="grid">
                <div>
                    <div class="chart-wrap">
                        <canvas id="sentiment-chart"></canvas>
                    </div>
                    <div style="margin-top:12px">
                        <h4 style="margin:0 0 8px 0">Sample Comments Analysis</h4>
                        <div id="comments-list" class="comments-list"></div>
                    </div>
                </div>

                <aside>
                    <div class="stats">
                        <div class="stat">
                            <div class="stat-header">
                                <div class="stat-title">Positive Comments</div>
                                <div id="positive-percentage" class="muted">0%</div>
                            </div>
                            <div id="positive-count" class="stat-value pos">0</div>
                        </div>

                        <div class="stat">
                            <div class="stat-header">
                                <div class="stat-title">Neutral Comments</div>
                                <div id="neutral-percentage" class="muted">0%</div>
                            </div>
                            <div id="neutral-count" class="stat-value neu">0</div>
                        </div>

                        <div class="stat">
                            <div class="stat-header">
                                <div class="stat-title">Negative Comments</div>
                                <div id="negative-percentage" class="muted">0%</div>
                            </div>
                            <div id="negative-count" class="stat-value neg">0</div>
                        </div>
                    </div>
                </aside>
            </div>
        </section>
    </div>

    <script src="sentiment.js"></script>
    <script src="script.js"></script>
    <script>
        document.getElementById('flow-btn').addEventListener('click', () => {
            window.open('flow.png', '_blank');
        });
    </script>
    <!-- Vanta background initialization removed -->
</body>
</html>
