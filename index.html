<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>YouTube Comment Sentiment Analyzer</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.cells.min.js"></script>
</head>
<body>
    <div id="vanta-bg"></div>
    <header class="fixed-header">
        <div class="container">
            <h1>Sentiment Analyze</h1>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <section class="input-section">
                <div class="input-group">
                    <label for="api-key">API Key:</label>
                    <input type="password" id="api-key" placeholder="Enter YouTube API key" required>
                    <small>Get from <a href="https://console.developers.google.com/" target="_blank">Google Console</a></small>
                </div>

                <div class="input-group">
                    <label for="youtube-url">Video URL:</label>
                    <input type="url" id="youtube-url" placeholder="https://www.youtube.com/watch?v=YbJOTdZBX1g" required>
                    <button type="button" id="random-url-btn" class="random-button">Auto Fill [API + URL]</button>
                </div>
                
                <div class="input-group">
                    <label for="comment-count">Comments:</label>
                    <select id="comment-count">
                        <option value="50">50</option>
                        <option value="100" selected>100</option>
                        <option value="200">200</option>
                        <option value="500">500</option>
                        <option value="1000">1000</option>
                        <option value="2000">2000</option>
                    </select>
                </div>

                <button id="analyze-btn" class="analyze-button">
                    <span class="btn-text">Analyze</span>
                    <span class="loading-spinner" style="display: none;">⏳</span>
                </button>
            </section>

            <section id="results-section" class="results-section" style="display: none;">
                <div class="recommendation" id="recommendation">
                    <h4>Recommendation:</h4>
                    <p id="recommendation-text">Analyzing...</p>
                </div>
                
                <div class="results-grid">
                    <div class="chart-container">
                        <h3>Sentiment Distribution</h3>
                        <canvas id="sentiment-chart"></canvas>
                    </div>
                    
                    <div class="stats-container">
                        <h3>Analysis Results</h3>
                        <div class="stats-grid">
                            <div class="stat-card positive">
                                <div class="stat-number" id="positive-count">0</div>
                                <div class="stat-label">Positive Comments</div>
                                <div class="stat-percentage" id="positive-percentage">0%</div>
                            </div>
                            
                            <div class="stat-card negative">
                                <div class="stat-number" id="negative-count">0</div>
                                <div class="stat-label">Negative Comments</div>
                                <div class="stat-percentage" id="negative-percentage">0%</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="comments-preview">
                    <h3>Sample Comments Analysis</h3>
                    <div id="comments-list" class="comments-list">
                        <!-- Comments will be populated here -->
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        VANTA.CELLS({
            el: "#vanta-bg",
            mouseControls: true,
            touchControls: true,
            gyroControls: false,
            minHeight: 200.00,
            minWidth: 200.00,
            scale: 1.00
        })
    </script>
</body>
</html>
